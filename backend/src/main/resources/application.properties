spring.application.name=manutencao-equipamentos
server.port=8080

# ---------------------------------------------------------------------------
# Banco de dados (PostgreSQL) - sobe com "docker compose up -d" na raiz do repo
# ---------------------------------------------------------------------------
# Os valores depois do ":" sao o default de desenvolvimento, igual para toda a
# equipe. Nao ha segredo aqui: o banco so aceita conexao local. Se um dia isso
# for para um servidor, basta definir as variaveis de ambiente e nada muda no
# codigo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/manutencao}
spring.datasource.username=${DB_USER:manutencao}
spring.datasource.password=${DB_PASSWORD:manutencao}

# ---------------------------------------------------------------------------
# JPA / Hibernate
#
# ATENCAO EQUIPE: hoje esta em "update", ou seja, o Hibernate cria/altera as
# tabelas sozinho a partir das @Entity. Isso e comodo enquanto o modelo esta
# mudando toda hora, mas NAO e o que sera entregue.
# Quando o modelo de dados estabilizar, mudar para "validate" e passar o schema
# para o Flyway (ver docs/BANCO.md).
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Flyway - versionamento do schema. Desligado ate escrevermos a V1__init.sql.
# ---------------------------------------------------------------------------
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Datas e fuso (o enunciado exige formato brasileiro na tela; a API troca
# datas em ISO-8601 e quem formata para dd/MM/yyyy e o Angular)
# ---------------------------------------------------------------------------
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------------
# Envio de e-mail (RF001 - senha aleatoria de 4 digitos enviada por e-mail)
#
# Em desenvolvimento use um SMTP de teste (Mailtrap, Mailpit ou MailHog) para
# nao depender de conta real. Preencha via variavel de ambiente, NUNCA commite
# senha de e-mail no repositorio.
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}

# ---------------------------------------------------------------------------
# Erros: nao vazar stacktrace para o front, mas manter a mensagem de negocio.
# Obs.: rodando com ./mvnw spring-boot:run o DevTools ignora o "never" e devolve
# o stacktrace mesmo assim - e proposital, para ajudar a debugar em dev. No jar
# empacotado (sem DevTools) o stacktrace nao aparece.
# ---------------------------------------------------------------------------
server.error.include-message=always
server.error.include-stacktrace=never
