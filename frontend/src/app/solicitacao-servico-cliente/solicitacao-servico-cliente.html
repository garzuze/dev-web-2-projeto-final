<div class="flex min-h-screen bg-[#f4f7f6] font-sans">
  <aside class="w-64 bg-white shadow-[1px_0_10px_rgba(0,0,0,0.03)] flex flex-col">
    <div class="p-6 border-b border-gray-100">
      <h2 class="text-xl font-bold text-slate-900">ManutençãoZica.com</h2>
    </div>
    
    <nav class="flex flex-col p-4 gap-2 mt-2">
      <a href="#" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-md transition-colors">
        Dados user
      </a>
      <a href="#" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-md transition-colors">
        Settings
      </a>
      <!-- Menu Ativo -->
      <a href="#" class="px-4 py-2 text-sm font-semibold bg-[#f4f7f6] text-slate-900 rounded-md">
        Solicitar manutenção
      </a>
      <a href="#" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-md transition-colors">
        Filtrar solicitação
      </a>
    </nav>
  </aside>

  <main class="flex-1 p-10 overflow-y-auto flex justify-center items-start">
    <div class="w-full max-w-3xl bg-white rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.03)] p-10">
      
      <h1 class="text-2xl font-bold text-center text-slate-900 mb-10">
        Solicitar manutenção
      </h1>

      <form [formGroup]="manutencaoForm" (ngSubmit)="onSubmit()">
        
        <div class="mb-8">
          <h3 class="text-sm font-bold text-slate-900 mb-4">Dados do Equipamento</h3>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex flex-col">
              <label class="text-xs font-semibold text-slate-700 mb-1.5">Tipo de equipamento *</label>
              <input 
                type="text" 
                formControlName="tipo"
                placeholder="Ex: Notebook, Desktop, Impressora" 
                class="px-3 py-2 border border-gray-200 rounded-md text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:border-[#b4cdd5] focus:ring-1 focus:ring-[#b4cdd5]"
              >
            </div>
            
            <div class="flex flex-col">
              <label class="text-xs font-semibold text-slate-700 mb-1.5">Marca / Modelo *</label>
              <input 
                type="text" 
                formControlName="modelo"
                placeholder="Ex: Dell Inspiron 15" 
                class="px-3 py-2 border border-gray-200 rounded-md text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:border-[#b4cdd5] focus:ring-1 focus:ring-[#b4cdd5]"
              >
            </div>
          </div>
        </div>

        <div class="mb-8">
          <h3 class="text-sm font-bold text-slate-900 mb-4">Detalhes da Solicitação</h3>
          
          <div class="flex flex-col">
            <label class="text-xs font-semibold text-slate-700 mb-1.5">Descrição do problema *</label>
            <textarea 
              rows="5" 
              formControlName="descricao"
              placeholder="Descreva com detalhes o que está acontecendo com o seu equipamento..." 
              class="px-3 py-2 border border-gray-200 rounded-md text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:border-[#b4cdd5] focus:ring-1 focus:ring-[#b4cdd5] resize-none"
            ></textarea>
          </div>
        </div>

        <div class="flex justify-end pt-4">
          <button 
            type="submit" 
            [disabled]="manutencaoForm.invalid"
            class="bg-[#b4cdd5] hover:bg-[#a3bfc8] text-slate-900 font-medium text-sm py-2 px-8 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Enviar
          </button>
        </div>
        
      </form>
    </div>
  </main>
</div>
