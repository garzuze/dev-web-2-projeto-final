<div class="min-h-screen flex bg-slate-50">
  
  <aside class="w-64 bg-white border-r border-gray-200 p-6 hidden md:flex flex-col shadow-sm">
    <h2 class="text-lg font-bold text-gray-900 mb-6 border-b border-gray-100 pb-2">Navbar Cliente</h2>
    <nav class="flex flex-col space-y-4 text-sm font-medium text-gray-600">
      <a href="#" class="hover:text-primary-800 transition">Dados User</a>
      <a href="#" class="hover:text-primary-800 transition">Settings</a>
      <a href="#" class="text-primary-800 font-semibold">Solicitar Manutenção (RF004)</a>
      <a href="#" class="hover:text-primary-800 transition">Filtrar Solicitação</a>
    </nav>
  </aside>

  <main class="flex-1 flex items-center justify-center p-4 sm:p-8">
    <div class="w-full max-w-3xl bg-white rounded-2xl border border-gray-100 p-6 sm:p-8 shadow-xl shadow-slate-200/50">
      <h2 class="text-2xl font-bold text-gray-900 tracking-tight text-center mb-6">Solicitar Manutenção</h2>
      <form [formGroup]="manutencaoForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div class="bg-gray-50/50 p-4 rounded-xl border border-gray-100">
          <h3 class="text-base font-bold text-gray-900 mb-4">Forms Solicitação</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block mb-1 text-sm font-medium text-gray-700" for="tipo">Tipo de Equipamento *</label>
              <input 
                type="text" 
                id="tipo" 
                formControlName="tipo" 
                placeholder="Ex: Computador, Impressora..." 
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
              >
              <span class="text-xs text-red-500 mt-1 block" *ngIf="manutencaoForm.get('tipo')?.touched && manutencaoForm.get('tipo')?.invalid">
                O tipo é obrigatório.
              </span>
            </div>
            <div>
              <label class="block mb-1 text-sm font-medium text-gray-700" for="modelo">Modelo *</label>
              <input 
                type="text" 
                id="modelo" 
                formControlName="modelo" 
                placeholder="Ex: Dell Inspiron 15" 
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
              >
              <span class="text-xs text-red-500 mt-1 block" *ngIf="manutencaoForm.get('modelo')?.touched && manutencaoForm.get('modelo')?.invalid">
                O modelo é obrigatório.
              </span>
            </div>
            <div class="md:col-span-2">
              <label class="block mb-1 text-sm font-medium text-gray-700" for="descricao">Descrição do Problema *</label>
              <textarea 
                id="descricao" 
                formControlName="descricao" 
                rows="4" 
                placeholder="Descreva detalhadamente o que está acontecendo..." 
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition resize-none"
              ></textarea>
              <span class="text-xs text-red-500 mt-1 block" *ngIf="manutencaoForm.get('descricao')?.touched && manutencaoForm.get('descricao')?.errors?.['required']">
                A descrição é obrigatória.
              </span>
              <span class="text-xs text-red-500 mt-1 block" *ngIf="manutencaoForm.get('descricao')?.touched && manutencaoForm.get('descricao')?.errors?.['minlength']">
                A descrição deve ter pelo menos 10 caracteres.
              </span>
            </div>
            
          </div>
        </div>
        <div class="flex justify-end pt-4 border-t border-gray-100">
          <button 
            type="submit" 
            class="py-2.5 px-8 text-sm font-semibold text-gray-900 bg-primary-700 rounded-lg shadow-sm hover:bg-primary-800 hover:text-white active:scale-[0.99] focus:ring-4 focus:ring-primary-700/30 transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Enviar
          </button>
        </div>
      </form>
    </div>
  </main>
  
</div>
