<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-2xl border border-gray-200 p-6 sm:p-8 shadow-sm">
    <h2 class="text-2xl font-bold text-gray-900 tracking-tight text-center">Manutenção Zica</h2> <!--TODO: decidir um nome para o sistema -->
    <p class="text-sm font-medium text-gray-700 mt-1 mb-6">Quebrou o Pc ? Faça o login que a gente resolve.</p>

    <form class="space-y-4" (ngSubmit)="onSubmit()" #loginForm="ngForm">

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-700" for="email">E-mail do usuário:</label>
            <input type="email" id="email" name="email" [(ngModel)]="loginData.email" required placeholder="exemplo@email.com"
             class="w-full p-2.5 text-sm text-gray-900 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none
  transition placeholder-gray-350"
            >
        </div>
        

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-700" for="password">Senha de acesso:</label>
            <input type="password" id="password" name="password" [(ngModel)]="loginData.password" required placeholder="********"
             class="w-full p-2.5 text-sm text-gray-900 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none
  transition placeholder-gray-350"
            >
        </div>
        

       <button 
      type="submit" 
      [disabled]="!loginForm.form.valid"
      class="w-full py-2.5 px-4 text-sm font-semibold text-white bg-blue-600 rounded-lg shadow-sm
             hover:bg-blue-700 active:scale-[0.99]
             focus:outline-none focus:ring-4 focus:ring-blue-500/25
             disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-600 disabled:active:scale-100
             transition-all duration-200"
    >
      Entrar no Sistema
    </button>

    </form>

    <div class="text-sm text-center text-gray-500 mt-6">
      Não tem conta? 
      <a 
        class="font-semibold text-blue-600 hover:text-blue-700 hover:underline ml-1 transition-colors duration-150" 
        href="#"
      >
        Realizar Autocadastro
      </a>
    </div>
</div>
