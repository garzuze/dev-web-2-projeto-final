 <div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-8">
      <div class="w-full max-w-md bg-white rounded-2xl border border-gray-200 p-6 sm:p-8 shadow-sm">
        
        <h2 class="text-2xl font-bold text-gray-900 tracking-tight text-center">Manutenção Zica</h2>
        <p class="text-sm font-medium text-gray-700 mt-1 mb-6 text-center">Quebrou o PC? Faça o login que a gente resolve.</p>
    
        <form class="space-y-4" (ngSubmit)="onSubmit()" #loginForm="ngForm">
    
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700" for="email">E-mail do usuário:</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              [(ngModel)]="loginData.email" 
              required 
              placeholder="exemplo@email.com"
              class="w-full p-2.5 text-sm text-gray-900 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition
  placeholder-gray-400"
            >
          </div>
    
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700" for="password">Senha de acesso:</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              [(ngModel)]="loginData.password" 
              required 
              placeholder="********"
              class="w-full p-2.5 text-sm text-gray-900 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition
  placeholder-gray-400"
            >
          </div>


          @if (errorMessage()) {
            <p class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-2.5">
              {{ errorMessage() }}
            </p>
          }

          <button 
            type="submit" 
            [disabled]="!loginForm.form.valid || loading()"
            class="w-full py-2.5 px-4 text-sm font-semibold text-gray-900 bg-primary-700 rounded-lg shadow-sm
                   hover:bg-primary-800 hover:text-white active:scale-[0.99]
                   focus:outline-none focus:ring-4 focus:ring-primary-700/30
                   disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-primary-700 disabled:hover:text-gray-900
                   transition-all duration-200 cursor-pointer"
          >
            {{ loading() ? 'Entrando...' : 'Entrar' }}
          </button>

        </form>

        <div class="text-sm text-center text-gray-500 mt-6">
	 Não tem conta? 
          <a 
            routerLink="/autocadastro" 
            class="font-semibold text-primary-800 hover:underline ml-1 transition-colors duration-150 cursor-pointer"
          >
            Realizar Autocadastro
          </a>
	</div>

      </div> 
    </div>
