 <div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 py-8">
      <div class="w-full max-w-4xl bg-white rounded-2xl border border-gray-100 p-6 sm:p-8 shadow-xl shadow-slate-200/50">
        
        <h2 class="text-2xl font-bold text-gray-900 tracking-tight text-center mb-6">Autocadastro</h2>
    
        <form [formGroup]="form" (ngSubmit)="cadastrar()" class="space-y-6">
    
          <!-- Dados Pessoais -->
          <div>
            <h3 class="text-base font-bold text-gray-900 mb-3">Dados Pessoais</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block mb-1 text-sm font-medium text-gray-700" for="nome">Nome Completo *</label>
                <input type="text" id="nome" name="nome" placeholder="Lucas Aws da Silva" formControlName="nome" 
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-white 
                focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block mb-1 text-sm font-medium text-gray-700" for="cpf">CPF *</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" formControlName="cpf"
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-white
                focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block mb-1 text-sm font-medium text-gray-700" for="telefone">Telefone *</label>
                <input type="text" id="telefone" name="telefone" placeholder="(41) 99999-9999" formControlName="telefone"
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-
                white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
              </div>
              <div class="md:col-span-3">
                <label class="block mb-1 text-sm font-medium text-gray-700" for="email">E-mail *</label>
                <input type="email" id="email" name="email" placeholder="unoRebaixado@exemplo.com" formControlName="email"
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-
                white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
              </div>
            </div>
          </div>
    
          <!-- Endereço (Ordem: CEP, Estado, Cidade, Bairro, Rua, Número, Complemento) -->
          <div>
            <h3 class="text-base font-bold text-gray-900 mb-3">Endereço</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block mb-1 text-sm font-medium text-gray-700" for="cep">CEP *</label>
                <input type="text" id="cep" name="cep" placeholder="80040-140" formControlName="cep" (blur)="buscaCep()"
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-white 
                focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block mb-1 text-sm font-medium text-gray-700" for="estado">Estado (UF) *</label>
                <input type="text" id="estado" name="estado" placeholder="Paraná (PR)" formControlName="estado" 
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-white
  focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block mb-1 text-sm font-medium text-gray-700" for="cidade">Cidade *</label>
                <input type="text" id="cidade" name="cidade" placeholder="Curitiba" formControlName="cidade"
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-white
                focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block mb-1 text-sm font-medium text-gray-700" for="bairro">Bairro *</label>
                <input type="text" id="bairro" name="bairro" placeholder="Cajurururururu" formControlName="bairro"
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-white
                focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block mb-1 text-sm font-medium text-gray-700" for="rua">Rua / Endereço *</label>
                <input type="text" id="rua" name="rua" placeholder="Rua dos bruxao loco" formControlName="rua"
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-white
                focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
              </div>
              <div>
                <label class="block mb-1 text-sm font-medium text-gray-700" for="numero">Número *</label>
                <input type="text" id="numero" name="numero" placeholder="1001" formControlName="numero"
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:bg-white focus:ring-
                2 focus:ring-blue-500 focus:outline-none transition">
              </div>
              <div class="md:col-span-3">
                <label class="block mb-1 text-sm font-medium text-gray-700" for="complemento">Complemento (opcional)</label>
                <input type="text" id="complemento" name="complemento" placeholder=" ex: do lado do pe de manga" formControlName="complemento"
                class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-300
                rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
              </div>
            </div>
          </div>

           <div class="flex items-center justify-center gap-6 pt-6 border-t border-gray-100">
      <span class="text-sm text-gray-600">
      Já tem conta? 
      <a 
        routerLink="/login" 
        class="font-semibold text-primary-800 hover:underline ml-1 transition cursor-pointer"
      >
        Fazer Login
      </a>
    </span>

     <button 
      type="submit" 
      class="py-2.5 px-6 text-sm font-semibold text-gray-900 bg-primary-700 rounded-lg shadow-sm hover:bg-primary-800 hover:text-white active:scale-[0.99] focus:ring-4 focus:ring-
  primary-700/30 transition-all cursor-pointer"
    >
      Criar Conta
    </button>
    </div>

        </form>
      </div>
    </div>
