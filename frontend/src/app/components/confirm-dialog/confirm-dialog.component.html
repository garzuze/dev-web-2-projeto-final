<app-modal-container>
  <h2 class="mb-4 text-2xl font-extrabold text-gray-900">{{ title }}</h2>
  <p class="mb-6 text-gray-700">{{ message }}</p>
  <div class="flex justify-end gap-3">
    <button
      class="cursor-pointer rounded-lg border border-gray-300 px-5 py-2 font-medium text-gray-700 transition hover:bg-gray-200 focus:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-50"
      type="button"
      (click)="cancel.emit()"
    >
      Cancelar
    </button>
    <button
      class="cursor-pointer rounded-lg bg-red-600 px-5 py-2 font-medium text-white transition hover:bg-red-800 focus:bg-red-800 focus:outline-none focus:ring-2 focus:ring-red-50 disabled:cursor-not-allowed disabled:bg-gray-300"
      type="button"
      [disabled]="busy"
      (click)="confirm.emit()"
    >
      {{ busy ? busyLabel : confirmLabel }}
    </button>
  </div>
</app-modal-container>
