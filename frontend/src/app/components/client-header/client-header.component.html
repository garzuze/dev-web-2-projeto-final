<header>
  <nav class="border-b border-gray-200 bg-gray-100 px-4 py-2.5 lg:px-6">
    <div class="mx-auto flex max-w-screen-xl flex-wrap items-center justify-between gap-4">
      <a routerLink="/client/request" class="flex items-center">
        <span class="self-center whitespace-nowrap text-xl font-semibold">ManutençãoZica.com</span>
      </a>

      <div class="order-3 flex w-full items-center gap-1 lg:order-2 lg:w-auto">
        <a routerLink="/client/request"
          [class]="isMyRequestsActive() ? 'bg-primary-800/20 text-primary-900' : 'text-gray-800 hover:bg-gray-200 hover:text-gray-900'"
          class="rounded-lg px-4 py-2 text-sm font-medium">
          Minhas solicitações
        </a>
        <a routerLink="/client/request/new"
          [class]="isNewRequestActive() ? 'bg-primary-800/20 text-primary-900' : 'text-gray-800 hover:bg-gray-200 hover:text-gray-900'"
          class="rounded-lg px-4 py-2 text-sm font-medium">
          Nova solicitação
        </a>
      </div>

      <div class="order-2 flex items-center gap-3 lg:order-3">
        @if (currentUser) {
        <div class="flex items-center gap-2">
          <span
            class="flex h-9 w-9 items-center justify-center rounded-full bg-primary-800 text-sm font-semibold text-white">
            {{ initials }}
          </span>
          <div class="hidden flex-col leading-tight sm:flex">
            <span class="text-sm font-medium text-gray-900">{{ currentUser.name }}</span>
            <span class="text-xs text-gray-500">Cliente</span>
          </div>
        </div>
        }

        <button type="button" (click)="onLogout()"
          class="group flex cursor-pointer items-center justify-center gap-2 rounded-lg border border-gray-400 bg-white px-4 py-2.5 text-sm font-medium text-gray-800 shadow-sm transition-all hover:bg-gray-50 focus:outline-none focus:ring-4 focus:ring-gray-200">
          <svg class="h-4 w-4 shrink-0 text-gray-600 transition duration-75 group-hover:text-gray-900"
            aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 16">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M1 8h11m0 0L8 4m4 4-4 4m4-11h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3" />
          </svg>
          Sair
        </button>
      </div>
    </div>
  </nav>
</header>
