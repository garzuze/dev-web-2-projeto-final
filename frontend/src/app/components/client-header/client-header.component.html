<header class="border-b border-gray-200/80 bg-white/85 shadow-sm backdrop-blur-md supports-[backdrop-filter]:bg-white/70">
  <nav class="container flex flex-wrap items-center justify-between gap-x-4 gap-y-3 py-3">
    <a routerLink="/client/request" class="flex items-center">
      <span class="self-center whitespace-nowrap text-xl font-semibold">ManutençãoZica.com</span>
    </a>

    <div class="order-3 flex w-full items-center gap-1 rounded-xl bg-gray-100 p-1 lg:order-2 lg:w-auto">
      <a routerLink="/client/request"
        [class]="isMyRequestsActive() ? 'bg-white text-primary-900 shadow-sm ring-1 ring-gray-200' : 'text-gray-600 hover:bg-white/60 hover:text-gray-900'"
        class="flex flex-1 items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition lg:flex-none">
        <svg class="h-4 w-4 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-6 9 2 2 4-4" />
        </svg>
        Minhas solicitações
      </a>
      <a routerLink="/client/request/new"
        [class]="isNewRequestActive() ? 'bg-white text-primary-900 shadow-sm ring-1 ring-gray-200' : 'text-gray-600 hover:bg-white/60 hover:text-gray-900'"
        class="flex flex-1 items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition lg:flex-none">
        <svg class="h-4 w-4 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Nova solicitação
      </a>
    </div>

    <div class="order-2 flex items-center gap-2 lg:order-3">
      @if (currentUser) {
      <div class="flex items-center gap-2.5 rounded-full py-1 pl-1 pr-1 sm:pr-3">
        <span
          class="flex h-9 w-9 items-center justify-center rounded-full bg-primary-700 text-sm font-semibold text-primary-900 ring-2 ring-white">
          {{ initials }}
        </span>
        <div class="hidden flex-col leading-tight sm:flex">
          <span class="text-sm font-semibold text-gray-900">{{ currentUser.name }}</span>
          <span class="text-xs text-gray-500">Cliente</span>
        </div>
      </div>
      <span class="hidden h-8 w-px bg-gray-200 sm:block" aria-hidden="true"></span>
      }

      <button type="button" (click)="onLogout()" title="Sair"
        class="group flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-gray-600 transition hover:bg-red-50 hover:text-red-700 focus:outline-none focus-visible:ring-4 focus-visible:ring-red-100">
        <svg class="h-4 w-4 shrink-0 transition group-hover:translate-x-0.5" aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 16">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M1 8h11m0 0L8 4m4 4-4 4m4-11h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3" />
        </svg>
        <span class="hidden sm:inline">Sair</span>
      </button>
    </div>
  </nav>
</header>
