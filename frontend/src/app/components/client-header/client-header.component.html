<header>
  <nav class="border-b border-gray-200 bg-gray-100 px-4 py-2.5 lg:px-6">
    <div class="mx-auto flex max-w-screen-xl flex-wrap items-center justify-between gap-4">
      <a routerLink="/client/request" class="flex items-center">
        <span class="self-center whitespace-nowrap text-xl font-semibold"
          >ManutençãoZica.com</span
        >
      </a>

      <div class="order-3 flex w-full items-center gap-1 lg:order-2 lg:w-auto">
        <a
          routerLink="/client/request"
          routerLinkActive="bg-primary-800/10 text-primary-800"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200"
        >
          Minhas solicitações
        </a>
        <a
          routerLink="/client/request/new"
          routerLinkActive="bg-primary-800/10 text-primary-800"
          class="rounded-lg px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200"
        >
          Nova solicitação
        </a>
      </div>

      <div class="order-2 flex items-center gap-3 lg:order-3">
        @if (currentUser) {
          <div class="flex items-center gap-2">
            <span
              class="flex h-9 w-9 items-center justify-center rounded-full bg-primary-800 text-sm font-semibold text-white"
            >
              {{ initials }}
            </span>
            <div class="hidden flex-col leading-tight sm:flex">
              <span class="text-sm font-medium text-gray-900">{{ currentUser.name }}</span>
              <span class="text-xs text-gray-500">Cliente</span>
            </div>
          </div>
        }
        <a
          routerLink="/login"
          class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
        >
          Sair
        </a>
      </div>
    </div>
  </nav>
</header>
