<!-- Botão flutuante para abrir o menu quando estiver fechado -->
<button
  (click)="toggleSidebar()"
  class="fixed top-4 left-4 z-30 inline-flex items-center rounded-lg bg-primary-800 p-2 text-sm text-white hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-gray-200"
  aria-label="Abrir menu"
>
  <svg class="h-6 w-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
    <path clip-rule="evenodd" fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"></path>
  </svg>
</button>

<!-- Fundo escurecido (aparece apenas quando o menu está aberto) -->
@if (isSidebarOpen) {
  <div 
    class="fixed inset-0 z-40 bg-gray-900/50 transition-opacity"
    (click)="closeSidebar()"
  ></div>
}

<aside
  id="main-sidebar"
  class="fixed top-0 left-0 z-50 h-screen w-64 transition-transform duration-300 ease-in-out"
  [class.-translate-x-full]="!isSidebarOpen"
  [class.translate-x-0]="isSidebarOpen"
  aria-label="Sidebar principal"
>
  <div class="flex h-full flex-col overflow-y-auto border-r border-gray-200 bg-gray-100 px-4 py-6 shadow-xl">
    <div class="mb-8 flex items-center justify-between px-2">
      <a 
        routerLink="/client/request" 
        class="flex items-center gap-3 focus:outline-none"
        (click)="closeSidebar()"
      >
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-primary-800 text-white">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </div>
        <span class="self-center whitespace-nowrap text-lg font-bold text-gray-900">
          ManutençãoZica
        </span>
      </a>

      <button 
        (click)="closeSidebar()"
        class="rounded-lg p-1.5 text-gray-500 hover:bg-gray-200 hover:text-gray-900 focus:outline-none"
      >
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <nav class="flex-1">
      <ul class="space-y-2 font-medium">
        <li>
          <a
            routerLink="/client/request"
            routerLinkActive="bg-primary-800/10 text-primary-800"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
            class="group flex items-center rounded-lg px-3 py-2.5 text-gray-700 transition-colors hover:bg-gray-200"
          >
            <svg class="h-5 w-5 shrink-0 text-gray-500 transition duration-75 group-hover:text-primary-800" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
            </svg>
            <span class="ml-3">Minhas solicitações</span>
          </a>
        </li>
        <li>
          <a
            routerLink="/client/request/new"
            routerLinkActive="bg-primary-800/10 text-primary-800"
            (click)="closeSidebar()"
            class="group flex items-center rounded-lg px-3 py-2.5 text-gray-700 transition-colors hover:bg-gray-200"
          >
            <svg class="h-5 w-5 shrink-0 text-gray-500 transition duration-75 group-hover:text-primary-800" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            <span class="ml-3">Nova solicitação</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="mt-auto border-t border-gray-200 pt-5">
      @if (currentUser) {
        <div class="mb-5 flex items-center gap-3 px-2">
          <span
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary-800 text-sm font-bold text-white shadow-md"
            title="{{ currentUser.name }}"
          >
            {{ initials }}
          </span>
          <div class="flex flex-col overflow-hidden leading-tight">
            <span class="truncate text-sm font-semibold text-gray-900">
              {{ currentUser.name }}
            </span>
            <span class="text-xs font-medium text-gray-500">
              Cliente
            </span>
          </div>
        </div>
      }

      <a
        routerLink="/login"
        (click)="closeSidebar()"
        class="group flex w-full items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 shadow-sm transition-all hover:bg-gray-50 focus:outline-none focus:ring-4 focus:ring-gray-200"
      >
        <svg class="h-4 w-4 shrink-0 text-gray-500 transition duration-75 group-hover:text-gray-900" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 16">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 8h11m0 0L8 4m4 4-4 4m4-11h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3"/>
        </svg>
        Sair
      </a>
    </div>

  </div>
</aside>
