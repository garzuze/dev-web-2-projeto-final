<div class="container py-8 md:py-12">
  <div class="mb-8">
    <h1 class="mb-2 text-3xl font-extrabold text-gray-900 md:text-4xl">
      Pagamento #{{ requestData?.id }}
    </h1>
  </div>
  <app-request-details-card [requestData]="requestData">
    <div class="rounded-b-xl bg-gray-50 p-6">
      <div class="grid gap-3">
        <button
          type="button"
          class="rounded-xl bg-emerald-500 px-5 py-2.5 font-medium text-white transition hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-200 shadow-sm cursor-pointer"
          (click)="onPayment()"
        >
          Realizar Pagamento
        </button>
      </div>
    </div>
  </app-request-details-card>
</div>

@if (isPaymentModalOpen) {
  <app-payment-modal
    (cancel)="onCancelPayment()"
    (confirm)="onConfirmPayment($event)"
    [isPaymenting]="isPaymenting"
  />
}
